<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé fond émeraude impérial -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021f18" />
    </linearGradient>

    <!-- Dégradé doré précieux -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Dégradé émeraude éclatant -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </linearGradient>

    <!-- Filtre ombre portée subtile -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fond squircle moderne iOS / Android -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Anneau subtil d'éclat interne -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.35" />

  <!-- Halo de lumière central -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" />

  <!-- Motif géométrique islamique : Étoile à 8 branches / Octagramme sacré -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- Carré 1 tourné à 0° -->
    <rect x="-145" y="-145" width="290" height="290" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.8" />
    <!-- Carré 2 tourné à 45° -->
    <rect x="-145" y="-145" width="290" height="290" rx="24" transform="rotate(45)" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.8" />

    <!-- Cercle intérieur de noblesse -->
    <circle cx="0" cy="0" r="115" fill="#022c22" fill-opacity="0.75" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" />

    <!-- Bouclier d'immunité contre le Feu stylisé -->
    <path d="M 0 -75 Q 55 -45 55 15 C 55 65 0 95 0 95 C 0 95 -55 65 -55 15 Q -55 -45 0 -75 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Calligraphie arabe centrale stylisée "هَيِّن" (Hayyin) -->
    <text x="0" y="24" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade', serif" font-size="78" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" direction="rtl">
      هَيِّن
    </text>

    <!-- Étoile d'éclat divine au sommet du bouclier -->
    <circle cx="0" cy="-84" r="5" fill="#fef08a" />
    <circle cx="0" cy="-84" r="9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
  </g>
</svg>
